<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';">
  <title>Quill badge</title>
  <link rel="stylesheet" href="badge.css">
</head>
<body>
  <button id="badge" class="badge idle" aria-label="Quill" title="Quill">
    <svg class="ring" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5"/></svg>
    <svg class="glyph check" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8.3l2.6 2.6L12 5.5"/></svg>
    <svg class="glyph quill" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 12.5L12 4M7 8.5c1.5-3.5 3.6-5 5.5-5.5-.4 2-2 4.2-5.4 5.6M5.3 10.2l1.8 1.1"/></svg>
    <span class="count" id="count"></span>
  </button>
  <script src="badge.js"></script>
</body>
</html>
